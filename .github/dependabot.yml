version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: monthly
          day: monday
          time: '00:05'
          timezone: Europe/Berlin
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      assignees:
          - FernetMenta
      versioning-strategy: increase
      ignore:
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']

    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: monthly
          day: monday
          time: '00:05'
          timezone: Europe/Berlin
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      assignees:
          - FernetMenta
