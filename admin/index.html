<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link
            rel="icon"
            href="./public/favicon.ico"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <meta
            name="theme-color"
            content="#000000"
        />
        <meta
            name="description"
            content="ioBroker eebus-go adapter admin"
        />
        <link
            rel="apple-touch-icon"
            href="./public/logo192.png"
        />
        <link
            rel="manifest"
            href="./public/manifest.json"
        />
        <script>
            const script = document.createElement('script');
            window.registerSocketOnLoad = function (cb) {
                window.socketLoadedHandler = cb;
            };
            const parts = (window.location.search || '').replace(/^\?/, '').split('&');
            const query = {};
            parts.forEach(item => {
                const [name, val] = item.split('=');
                query[decodeURIComponent(name)] = val !== undefined ? decodeURIComponent(val) : true;
            });
            script.onload = function () {
                typeof window.socketLoadedHandler === 'function' && window.socketLoadedHandler();
            };
            script.src =
                window.location.port === '3000'
                    ? window.location.protocol +
                      '//' +
                      (query.host || window.location.hostname) +
                      ':' +
                      (query.port || 8081) +
                      '/lib/js/socket.io.js'
                    : './../../lib/js/socket.io.js';

            document.head.appendChild(script);
        </script>
        <title>eebus-go Admin</title>
      <script type="module" crossorigin src="./assets/index-DrwUbNF2.js"></script>
      <link rel="stylesheet" crossorigin href="./assets/index-DYPFnrYA.css">
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
